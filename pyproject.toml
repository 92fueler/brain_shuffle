[project]
name = "brain-shuffle"
version = "0.1.0"
description = "Knowledge retention, active recall, and topic shuffle engine"
readme = "README.md"
authors = [
    { name = "92fueler", email = "jianjoycewu@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.48",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
brain-shuffle = "brain_shuffle.main:main"
brain-shuffle-cli = "brain_shuffle.cli:cli"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
